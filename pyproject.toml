[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tailctl"
version = "0.1.0"
description = "Tailnet identity coordinator for parallel sessions on a single Mac"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "DRYCodeWorks", email = "dan@drycodeworks.com" }]
dependencies = [
    "PyYAML>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-timeout>=2.2",
    "ruff>=0.4",
]

[project.scripts]
tailctl = "tailctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires real tailscale CLI; not run by default",
    "smoke: parallel smoke test; requires TAILCTL_RUN_REAL_TAILSCALE=1",
]
timeout = 10

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
